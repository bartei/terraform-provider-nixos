name: Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install Nix
        # Pinned to a release tag instead of @main to avoid drifting onto a
        # build of the action that requires Node runtimes GitHub has marked
        # deprecated.
        uses: DeterminateSystems/nix-installer-action@v22

      # Note: DeterminateSystems/magic-nix-cache-action now requires FlakeHub
      # registration. We rely on Nix's own substituter (cache.nixos.org) for
      # binary cache hits — first run rebuilds the qcow2 image (~3-4 min on
      # a cold runner), subsequent jobs only build the test toplevel diff.

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage

      - name: Probe KVM
        run: |
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM available — accelerated"
          else
            echo "KVM not available — falling back to TCG (slow)"
            ls -l /dev/kvm 2>&1 || true
          fi

      - name: Build VM image
        run: ./build.sh
        working-directory: test/qemu

      - name: Boot VM
        run: ./run.sh > .vm-host
        working-directory: test/qemu
        env:
          NIXOS_TEST_BOOT_TIMEOUT: "300"

      # Second VM: stock Debian cloud image, the non-NixOS target for the
      # nixos_system_manager tests (Nix gets installed by the provider).
      - name: Boot Debian VM
        run: ./run.sh > .vm-host
        working-directory: test/debian
        env:
          DEBIAN_TEST_BOOT_TIMEOUT: "300"

      - name: Run acceptance tests
        run: |
          export TF_ACC=1
          export NIXOS_TEST_HOST=$(cat test/qemu/.vm-host)
          export SYSMGR_TEST_HOST=$(cat test/debian/.vm-host)
          export NIXOS_TEST_KEY_PATH=$PWD/test/qemu/.keys/id_ed25519
          export NIXOS_TEST_USER=root
          go test -v -count=1 -timeout 30m ./internal/resource/... ./internal/sshclient/...

      - name: Dump VM serial logs on failure
        if: failure()
        run: |
          echo "::group::NixOS VM serial log"
          tail -200 test/qemu/serial.log || true
          echo "::endgroup::"
          echo "::group::Debian VM serial log"
          tail -200 test/debian/serial.log || true
          echo "::endgroup::"

      - name: Stop VMs
        if: always()
        run: |
          (cd test/qemu && ./stop.sh)
          (cd test/debian && ./stop.sh)
